<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemitMon - Live Payment Processing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 30px; border-bottom: 2px solid #0ea5e9; padding-bottom: 15px; }
        h1 { font-size: 2em; color: #0ea5e9; margin-bottom: 5px; }
        .subtitle { font-size: 0.95em; color: #94a3b8; }
        .layout { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; } }
        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 20px; }
        .panel h2 { color: #0ea5e9; margin-bottom: 15px; font-size: 1.2em; }
        .payment-form { display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; color: #cbd5e1; margin-bottom: 4px; font-weight: 500; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 4px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #0ea5e9; }
        .button { background: #0ea5e9; color: #0f172a; border: none; padding: 10px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .button:hover { background: #0284c7; }
        .payment-list { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; }
        .payment-item { background: #0f172a; border-left: 4px solid #0ea5e9; padding: 12px; border-radius: 4px; }
        .payment-item.allow { border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .payment-item.reject { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .payment-item.escalate { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .payment-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .payment-from-to { font-size: 0.9em; color: #cbd5e1; margin-bottom: 6px; }
        .payment-amount { font-weight: 600; font-size: 1.1em; color: #0ea5e9; }
        .payment-status { padding: 3px 8px; border-radius: 3px; font-size: 0.75em; font-weight: 600; white-space: nowrap; }
        .status-allow { background: #10b981; color: white; }
        .status-reject { background: #ef4444; color: white; }
        .status-escalate { background: #f59e0b; color: white; }
        .payment-details { font-size: 0.8em; color: #94a3b8; line-height: 1.4; margin-top: 8px; }
        .rule-hit { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(100, 116, 139, 0.3); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 4px; text-align: center; }
        .stat-label { font-size: 0.75em; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 1.5em; font-weight: 600; color: #0ea5e9; margin-top: 4px; }
        .stat-box.reject .stat-value { color: #ef4444; }
        .stat-box.allow .stat-value { color: #10b981; }
        .stat-box.escalate .stat-value { color: #f59e0b; }
        .sample-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .sample-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 12px; border-radius: 4px; font-size: 0.8em; cursor: pointer; }
        .sample-btn:hover { background: #475569; }
        .decision-flow { display: flex; flex-direction: column; gap: 8px; font-size: 0.9em; }
        .flow-step { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
        .flow-step.pass { color: #10b981; font-weight: 600; }
        .flow-step.fail { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 RemitMon Payment Processing Engine</h1>
            <p class="subtitle">Real-time RfP evaluation with policy rules and intelligent escalation</p>
        </header>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Processed</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-box allow">
                <div class="stat-label">Approved</div>
                <div class="stat-value" id="allowCount">0</div>
            </div>
            <div class="stat-box reject">
                <div class="stat-label">Rejected</div>
                <div class="stat-value" id="rejectCount">0</div>
            </div>
            <div class="stat-box escalate">
                <div class="stat-label">Escalated</div>
                <div class="stat-value" id="escalateCount">0</div>
            </div>
        </div>
        
        <div class="layout">
            <div class="panel">
                <h2>📝 Submit Payment RfP</h2>
                <div class="payment-form">
                    <div class="form-group">
                        <label>From Account</label>
                        <select id="fromAccount">
                            <option value="USD Operating">USD Operating Account</option>
                            <option value="EUR International">EUR International Account</option>
                            <option value="GBP Treasury">GBP Treasury Account</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>To Counterparty</label>
                        <select id="toCounterparty">
                            <option value="Partner Bank Switzerland">Partner Bank Switzerland</option>
                            <option value="Emerging Markets Corp">Emerging Markets Corp</option>
                            <option value="Tokyo Financial Partners">Tokyo Financial Partners</option>
                            <option value="Unknown Entity">Unknown Entity</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (USD)</label>
                        <input type="number" id="amount" placeholder="Enter amount" value="25000" min="0" step="1000">
                    </div>
                    <div class="form-group">
                        <label>Purpose</label>
                        <select id="purpose">
                            <option>Wire Transfer</option>
                            <option>ACH Payment</option>
                            <option>RTP Payment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Destination Country</label>
                        <select id="country">
                            <option>United States</option>
                            <option>United Kingdom</option>
                            <option>Switzerland</option>
                            <option>Japan</option>
                            <option>Iran</option>
                            <option>North Korea</option>
                        </select>
                    </div>
                    <button class="button" onclick="submitPayment()">Process RfP</button>
                    <div class="sample-buttons">
                        <button class="sample-btn" onclick="quickTest('small')">$10K ✓</button>
                        <button class="sample-btn" onclick="quickTest('medium')">$60K ⚠️</button>
                        <button class="sample-btn" onclick="quickTest('large')">$120K ✗</button>
                        <button class="sample-btn" onclick="quickTest('sanctioned')">Sanctioned ✗</button>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>⚡ Processing Results</h2>
                <div class="payment-list" id="paymentList">
                    <div style="color: #94a3b8; text-align: center; padding: 40px 20px;">Submit RfPs to see policy evaluation...</div>
                </div>
            </div>
        </div>
        
        <div class="panel" id="flowPanel" style="display: none;">
            <h2>🔄 Decision Flow</h2>
            <div class="decision-flow" id="decisionFlow"></div>
        </div>
    </div>
    
    <script>
        const payments = [];
        let stats = { total: 0, allow: 0, reject: 0, escalate: 0 };
        
        function evaluatePayment(data) {
            let decision = 'allow';
            let ruleHits = [];
            
            if (['Iran', 'North Korea', 'Syria'].includes(data.country)) {
                decision = 'reject';
                ruleHits.push('🚫 Sanctioned country: Reject');
            }
            
            if (data.amount >= 100000) {
                decision = 'reject';
                ruleHits.push('💰 High-value > $100K: Reject');
            } else if (data.amount >= 50000) {
                if (decision !== 'reject') decision = 'escalate';
                ruleHits.push('⚠️ High-value > $50K: Escalate');
            }
            
            if (data.toCounterparty === 'Unknown Entity' && decision === 'allow') {
                decision = 'escalate';
                ruleHits.push('❓ Unknown counterparty: Human review required');
            }
            
            return { decision, ruleHits };
        }
        
        function submitPayment() {
            const data = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString(),
                fromAccount: document.getElementById('fromAccount').value,
                toCounterparty: document.getElementById('toCounterparty').value,
                amount: parseFloat(document.getElementById('amount').value),
                purpose: document.getElementById('purpose').value,
                country: document.getElementById('country').value
            };
            
            const evaluation = evaluatePayment(data);
            const payment = { ...data, decision: evaluation.decision, ruleHits: evaluation.ruleHits };
            
            payments.unshift(payment);
            stats.total++;
            stats[evaluation.decision]++;
            updateUI();
            showDecisionFlow(payment);
        }
        
        function quickTest(type) {
            const a = document.getElementById('amount');
            const c = document.getElementById('country');
            const p = document.getElementById('toCounterparty');
            
            if (type === 'small') { a.value = 10000; c.value = 'Switzerland'; p.value = 'Partner Bank Switzerland'; }
            else if (type === 'medium') { a.value = 60000; c.value = 'United States'; p.value = 'Emerging Markets Corp'; }
            else if (type === 'large') { a.value = 120000; c.value = 'Japan'; p.value = 'Tokyo Financial Partners'; }
            else if (type === 'sanctioned') { a.value = 50000; c.value = 'Iran'; p.value = 'Unknown Entity'; }
            
            setTimeout(submitPayment, 50);
        }
        
        function showDecisionFlow(p) {
            const fp = document.getElementById('flowPanel');
            const df = document.getElementById('decisionFlow');
            fp.style.display = 'block';
            
            const dec = p.decision === 'allow' ? '✅ APPROVED' : p.decision === 'reject' ? '🚫 REJECTED' : '⚠️ ESCALATED';
            const cls = p.decision === 'allow' ? 'pass' : 'fail';
            
            df.innerHTML = `
                <div class="flow-step">📥 RfP received: ${p.amount.toLocaleString('en-US', {style: 'currency', currency: 'USD'})}</div>
                <div class="flow-step">🔍 Validating counterparty: ${p.toCounterparty}</div>
                <div class="flow-step">🏛️ Checking OFAC & sanctions...</div>
                <div class="flow-step">💼 Evaluating account policies...</div>
                ${p.ruleHits.map(h => `<div class="flow-step">${h}</div>`).join('')}
                <div class="flow-step ${cls}" style="margin-top: 10px; border-top: 1px solid rgba(100, 116, 139, 0.3); padding-top: 10px;"><strong>${dec}</strong></div>
            `;
        }
        
        function updateUI() {
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('allowCount').textContent = stats.allow;
            document.getElementById('rejectCount').textContent = stats.reject;
            document.getElementById('escalateCount').textContent = stats.escalate;
            
            const pl = document.getElementById('paymentList');
            pl.innerHTML = payments.map(p => `
                <div class="payment-item ${p.decision}">
                    <div class="payment-header">
                        <div>
                            <div class="payment-from-to">${p.fromAccount} → ${p.toCounterparty}</div>
                            <div class="payment-amount">${p.amount.toLocaleString('en-US', {style: 'currency', currency: 'USD'})}</div>
                        </div>
                        <span class="payment-status status-${p.decision}">${p.decision.toUpperCase()}</span>
                    </div>
                    <div class="payment-details">
                        <div>🕐 ${p.timestamp} • ${p.purpose} • ${p.country}</div>
                        ${p.ruleHits.length > 0 ? `<div class="rule-hit"><strong>Rules:</strong> ${p.ruleHits.join(' | ')}</div>` : '<div class="rule-hit"><strong>✅ All policies passed</strong></div>'}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
